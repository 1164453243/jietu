name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust (diagnostic)
        shell: bash
        working-directory: src-tauri
        run: cargo check ${{ matrix.args }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'jietu ${{ github.ref_name }}'
          releaseBody: |
            ## Changes
            See commit history for details.

            ## Downloads
            - **macOS Apple Silicon**: `jietu_*_aarch64.dmg`
            - **macOS Intel**: `jietu_*_x64.dmg`
            - **Windows**: `jietu_*_x64-setup.exe` or `jietu_*_x64_en-US.msi`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
