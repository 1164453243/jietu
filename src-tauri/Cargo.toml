[package]
name = "jietu"
version = "0.1.0"
description = "Lightweight Screenshot Tool"
authors = ["you"]
edition = "2021"

[lib]
name = "jietu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
xcap = "*"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# objc 0.2's sel_impl macro uses #[cfg(cargo-clippy)] internally;
# declare it as expected so Rust doesn't emit unexpected_cfgs warnings.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo-clippy)'] }
